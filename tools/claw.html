<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claw sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
  body{margin:0;background:#141114;color:#d9d2c4;font:500 12px Archivo,Arial,sans-serif}
  #work{position:absolute;left:-4000px;top:0;width:1380px;height:1740px}
  #sheet{display:flex;flex-wrap:wrap;gap:8px;padding:8px}
  figure{margin:0;display:flex;flex-direction:column;gap:3px}
  figcaption{opacity:.75}
  canvas.p{display:block;background:#000}
</style>
</head>
<body>
<!-- The crane drawn at full backing resolution off screen, then copied: the whole window at a few beats,
     and loupes (1:1 device pixels) around the claw and the trolley. Hash options:
     #rider=redpanda&copies=4&seed=3&loupe=300&full=0.8&set=a  (set a = the usual beats, set b = trolley) -->
<canvas id="work" width="460" height="580"></canvas>
<div id="sheet"></div>
<script src="../lib/matter.min.js"></script>
<script src="../js/art.js"></script>
<script src="../js/animals/kit.js"></script>
<script src="../js/animals/redpanda.js"></script>
<script src="../js/animals/turtle.js"></script>
<script src="../js/animals/axolotl.js"></script>
<script src="../js/animals/shark.js"></script>
<script src="../js/animals/pangolin.js"></script>
<script>
  const Q = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(p => p.split('=')));
  // repeatable runs: seed Math.random
  let seed = +(Q.seed || 7) >>> 0;
  Math.random = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  // find the hub body so the loupe can follow it
  const claw = [];
  const rect = Matter.Bodies.rectangle;
  Matter.Bodies.rectangle = function (x, y, w, h, o) { const b = rect.apply(this, arguments); if (o && o.label === 'claw') claw.push(b); return b; };
</script>
<script src="../js/machine.js"></script>
<script>
  const W = 460, H = 580, work = document.getElementById('work'), sheet = document.getElementById('sheet');
  const names = ['Minjun Kim', 'Sojeong Lee', 'Hojae Lee', 'Martin Vladimirov Karastoyanov'];
  const beats = [];
  const M = Machine(work, { sfx() {}, motor() {}, onBeat(b) { beats.push(b); }, onPick(c) { beats.push('PICK'); } });
  const rider = Q.rider === 'none' ? null : (Q.rider || 'redpanda');
  if (rider) M.setRider(rider, { n: '3', bg: '#f3b21b', fg: '#1c1b1f' });
  const LOUPE = +(Q.loupe || 300), FULL = +(Q.full || .62), SPAN = +(Q.span || 110);
  function step(n) { for (let i = 0; i < n; i++) M.frame(1 / 60, 1 / 60); }
  function until(test, max = 40) { let t = 0; while (t < max && !test()) { M.frame(1 / 60, 1 / 60); t += 1 / 60; } return t; }
  const hub = () => claw[0];
  function toScreen(x, y) {
    const f = M.focus, S = work.width / W;
    return [((x - f.x * W) * f.z + W / 2) * S, ((y - f.y * H) * f.z + H / 2) * S];
  }
  function panel(label, w, h) {
    const fig = document.createElement('figure'), cv = document.createElement('canvas'), cap = document.createElement('figcaption');
    cv.className = 'p'; cv.width = w; cv.height = h; cap.textContent = label;
    fig.append(cv, cap); sheet.append(fig); return cv.getContext('2d');
  }
  function full(label) {
    const k = FULL, g = panel(label + ' (window)', Math.round(W * 3 * k / 1.5), Math.round(H * 3 * k / 1.5));
    g.imageSmoothingQuality = 'high'; g.drawImage(work, 0, 0, g.canvas.width, g.canvas.height);
  }
  // a square of `span` world units around (wx, wy), shown LOUPE px wide
  function loupe(label, wx, wy, span = SPAN) {
    const [sx, sy] = toScreen(wx, wy), src = span * M.focus.z * work.width / W, g = panel(label + ` (z ${M.focus.z.toFixed(2)}, ${(src / LOUPE).toFixed(2)} px/px)`, LOUPE, LOUPE);
    g.imageSmoothingQuality = 'high'; g.drawImage(work, sx - src / 2, sy - src / 2, src, src, 0, 0, LOUPE, LOUPE);
  }
  const at = () => hub().position;
  M.play(names, 'Group 3', +(Q.copies || 4));
  const set = Q.set || 'a';
  if (set === 'a') {
    until(() => M.mode === 'aim'); step(40);
    full('aim');
    loupe('aim: claw', at().x, at().y + 10);
    until(() => beats.includes('lock')); step(20);
    loupe('lock: claw over the can', at().x, at().y + 26);
    until(() => M.mode === 'lower'); step(18);
    loupe('lower', at().x, at().y + 30);
    until(() => M.mode === 'close'); step(1);
    loupe('contact, open', at().x, at().y + 30);
    until(() => M.mode === 'pause'); step(6);
    loupe('closed on the can', at().x, at().y + 34);
    until(() => M.mode === 'top'); step(20);
    loupe('top: holding', at().x, at().y + 30);
    full('top');
    until(() => M.mode === 'carry'); step(12);
    full('carry');
  } else if (set === 'b') {
    until(() => M.mode === 'aim'); step(40);
    loupe('trolley at home', at().x, 34, 80);
    full('aim');
    until(() => beats.includes('go')); step(30);
    loupe('trolley moving', at().x, 34, 80);
    full('seek');
  } else if (set === 'z') {
    // close-ups near 1:1 device pixels
    until(() => M.mode === 'aim'); step(40);
    loupe('aim: claw', at().x, at().y + 12, +(Q.zspan || 80));
    until(() => M.mode === 'pause'); step(6);
    loupe('closed on the can', at().x, at().y + 30, +(Q.zspan || 80));
    until(() => M.mode === 'top'); step(20);
    loupe('top: holding', at().x, at().y + 26, +(Q.zspan || 80));
  } else if (set === 't') {
    // the trolley close, when the camera is nearest it (carrying the can home)
    until(() => M.mode === 'carry'); step(+(Q.extra || 8));
    const tx = claw[0].position.x;
    loupe('trolley, carrying', tx, 30, +(Q.zspan || 70));
    full('carry');
  } else if (set === 'c') {
    // the whole run as a strip of windows
    const marks = ['aim', 'seek', 'lower', 'close', 'pause', 'raise', 'top', 'carry', 'release'];
    for (const m of marks) { until(() => M.mode === m); step(m === 'close' ? 1 : 12); full(m); }
  }
  M.frame(0, 0);
  document.title = 'Claw sheet ready';
</script>
</body>
</html>
