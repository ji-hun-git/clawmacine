<!doctype html><meta charset="utf-8"><title>Cans</title>
<!-- preview of ART.drawCan: ?v=all | pile | close | poses | reveal (&sq=, &spin=) | machine (&m=play, &n=, &copies=, &sec=, &seed=, &cw=)
     | bench (&raf=1 times real frames; &only=moving,...); &t=seconds for the carried label -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>html,body{margin:0;background:#0e0d10;color:#b9b2a6;font:12px Archivo,sans-serif}canvas{display:block}#o{position:fixed;right:8px;top:6px}</style>
<div id="o"></div><canvas id="c"></canvas>
<script src="../js/art.js"></script>
<script>
const q = new URLSearchParams(location.search), V = q.get('v') || 'all', T = +(q.get('t') || 1.3);
const cv = document.getElementById('c'), g = cv.getContext('2d'), dpr = Math.max(1, devicePixelRatio || 1);
const W = 1500, H = 950; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const names = ['Jun Wang', 'Martin Karastoyanov', 'Jua Im', 'Ada Okafor', 'Seo-yeon Park', 'Élodie Brun', 'Minho Lee', 'Tomas Ruiz'];
const cans = names.map((n, i) => ({ name: n, label: i % 7, lot: String(20 + i), body: { id: i } }));
function room(x, y, w, h) {             // the machine's dark interior with the marquee lamp above
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const b = g.createLinearGradient(0, y, 0, y + h); b.addColorStop(0, '#2a2622'); b.addColorStop(.7, '#16130f'); b.addColorStop(1, '#0d0b09');
  g.fillStyle = b; g.fillRect(x, y, w, h);
  const l = g.createRadialGradient(x + w * .32, y - h * .1, 20, x + w * .32, y - h * .1, h * 1.1);
  l.addColorStop(0, 'rgba(255,233,196,.22)'); l.addColorStop(1, 'rgba(255,233,196,0)'); g.fillStyle = l; g.fillRect(x, y, w, h);
  g.restore();
}
function pile(ox, oy, s) {              // game-size cans (44 x 58) in a settled heap, drawn at stage zoom s
  g.save(); g.translate(ox, oy); g.scale(s, s);
  room(0, 0, 460, 300);
  const fl = 280; g.fillStyle = '#0b0908'; g.fillRect(0, fl, 460, 20);
  const P = [[40, 0, 0], [86, 0, .04], [132, 0, 0], [180, 0, 1.5708], [236, 0, 1.5708 + .12], [300, 0, 3.14], [352, 0, -.3], [410, 0, 0],
    [62, 1, .05], [110, 1, -.08], [158, 1, 1.4], [224, 1, 2.2], [290, 1, -1.5708], [340, 1, .6], [396, 1, 0],
    [90, 2, .2], [150, 2, -.7], [260, 2, 1.1], [330, 2, 0], [200, 3, .35]];
  P.forEach(([x, r, a], i) => {
    const up = Math.abs(Math.cos(a)), ext = 29 * up + 22 * (1 - up);
    ART.drawCan(g, cans[(i * 3) % 8], x, fl - ext - r * 52, a, 44, 58, { spin: (i * .137) % 1, lit: i % 5 ? 1 : .55 });
  });
  g.restore();
}
function close(ox, oy, s, k, a, o) { g.save(); g.translate(ox, oy); g.scale(s, s); ART.drawCan(g, cans[k], 0, 0, a, 44, 58, o || {}); g.restore(); }
function draw() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#0e0d10'; g.fillRect(0, 0, W, H);
  if (V === 'pile') { pile(40, 60, 3); return; }
  if (V === 'close') { room(0, 0, W, H); close(260, 470, 7, 3, .1); close(760, 470, 7, 1, -.06, { spin: .05 }); close(1230, 470, 6, 0, .25, { labelShift: T * .35 }); return; }
  if (V === 'poses') {
    room(0, 0, W, H);
    [0, .5, 1.5708, 2.4, 3.1416, -1.5708, -.7].forEach((a, i) => close(120 + i * 210, 260, 3.2, i % 8, a, { spin: i * .1 }));
    [0, .2, .4, .6, .8].forEach((s, i) => close(160 + i * 290, 700, 4.2, (i + 2) % 8, 0, { spin: s, lit: i === 4 ? .4 : 1 }));
    return;
  }
  if (V === 'reveal') {                 // the roll-call portrait as game.js paints it: black stage, a pool of lamp light
    const sq = +(q.get('sq') || 0), spin = +(q.get('spin') || 0);
    [[0, cans[1], sq, spin], [760, cans[3], .5, .1]].forEach(([ox, can, sqz, sp]) => {
      g.save(); g.translate(ox + 60, 120); g.fillStyle = '#060506'; g.fillRect(0, 0, 520, 560);
      const beam = g.createLinearGradient(0, 0, 0, 500); beam.addColorStop(0, 'rgba(255,233,196,0)'); beam.addColorStop(1, 'rgba(255,233,196,.16)');
      g.fillStyle = beam; g.beginPath(); g.moveTo(190, 0); g.lineTo(330, 0); g.lineTo(470, 500); g.lineTo(50, 500); g.closePath(); g.fill();
      g.save(); g.translate(260, 478); g.scale(1, .3); const pool = g.createRadialGradient(0, 0, 8, 0, 0, 250);
      pool.addColorStop(0, 'rgba(255,233,196,.6)'); pool.addColorStop(1, 'rgba(255,233,196,0)'); g.fillStyle = pool; g.beginPath(); g.arc(0, 0, 250, 0, Math.PI * 2); g.fill(); g.restore();
      const w = 200, h = w * 58 / 44;
      ART.drawCan(g, can, 200, 470 - h / 2 * (1 - sqz * .7), 0, w, h, { spin: sp, squash: sqz, shadow: true, rim: 1 });
      g.restore();
    });
    return;
  }
  // all: pile at stage size on the left, three close-ups on the right
  pile(20, 20, 1.6);
  room(770, 20, 710, 910);
  close(900, 230, 4.2, 3, .06); close(1280, 230, 4.2, 1, -.1, { spin: .04 });
  close(900, 620, 3.6, 2, 1.5708, { spin: .1 }); close(1300, 640, 3.6, 5, 2.5, { spin: .3 });
  ART.drawCan(g, cans[0], 180, 760, 0, 120, 158, { shadow: true, rim: .8 });
  ART.drawCan(g, cans[4], 420, 760, .12, 120, 158, { labelShift: T * .35 });
  ART.drawCan(g, cans[6], 620, 780, 0, 120, 158, { squash: .45, shadow: true });
}
function machine() {                    // the real crane with a real pile: ?v=machine&n=16&copies=3&sec=6&seed=1
  const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  cv.remove();
  const mc = document.createElement('canvas'); mc.style.width = (q.get('cw') || 740) + 'px'; document.body.appendChild(mc);
  let seed = +(q.get('seed') || 1); Math.random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const all = ['Jun Wang', 'Martin Karastoyanov', 'Jua Im', 'Ada Okafor', 'Seo-yeon Park', 'Élodie Brun', 'Minho Lee', 'Tomas Ruiz', 'Han Nia', 'Sungjoo Kim', 'Jae Lee', 'Minjun Kim', 'Sojeong Lee', 'Martin Lee', 'Angeon Lee', 'Tae Oh'];
  const fonts = document.fonts ? Promise.race([document.fonts.load('40px "Alfa Slab One"'), new Promise(r => setTimeout(r, 3000))]).catch(() => {}) : Promise.resolve();
  ['../lib/matter.min.js', '../js/animals/kit.js', '../js/animals/redpanda.js', '../js/machine.js'].reduce((p, s) => p.then(() => load(s)), fonts).then(() => {
    const M = Machine(mc, { sfx() {}, motor() {}, onReady() {}, onSeek() {}, onMiss() {}, onSlip() {}, onPick() {}, onBeat() {} });
    M.setRider('redpanda', { n: '1', bg: '#e2372c', fg: '#fff' });
    const ns = all.slice(0, +(q.get('n') || 8)), cp = +(q.get('copies') || 3);
    if (q.get('m') === 'play') M.play(ns, 'Group 1', cp); else M.attract(ns.flatMap(n => Array(cp).fill(n)));
    const sec = +(q.get('sec') || 5);
    for (let i = 0; i < sec * 60; i++) M.frame(1 / 60, 1 / 60);
    let f = 0; const tick = () => { M.frame(1 / 60, 1 / 60); if (++f < 40) requestAnimationFrame(tick); }; tick();
  }, e => { document.getElementById('o').textContent = 'load failed ' + e; });
}
function bench() {                      // ?v=bench: JS cost per frame of 20 cans (median and p95 ms) in four situations
  const cs = []; for (let i = 0; i < 20; i++) { const n = names[i % 8]; cs.push({ name: n, ...ART.canStyle(n), body: { id: i } }); }
  const S = {
    still: t => cs.forEach((k, i) => ART.drawCan(g, k, 60 + (i % 10) * 80, 150 + (i / 10 | 0) * 200, (i * .7) % 6.28, 44, 58, {})),
    moving: t => cs.forEach((k, i) => ART.drawCan(g, k, 60 + (i % 10) * 80, 150 + (i / 10 | 0) * 200 + Math.sin(t * 2 + i) * 20, t * .7 + i, 44, 58, { spin: (t * .2 + i * .1) % 1, lit: .5 + .5 * Math.sin(t + i) })),
    zoom3: t => { g.translate(450, 300); g.scale(3, 3); g.translate(-450, -300); cs.forEach((k, i) => ART.drawCan(g, k, 60 + (i % 10) * 80, 150 + (i / 10 | 0) * 200, t * .7 + i, 44, 58, {})); },
    carry: t => cs.forEach((k, i) => ART.drawCan(g, k, 60 + (i % 10) * 80, 150 + (i / 10 | 0) * 200, .1, 44, 58, { labelShift: t * .35 + i })),
  };
  const names2 = q.get('only') ? q.get('only').split(',') : Object.keys(S), out = [], raf = q.get('raf') === '1'; let si = 0, f = 0, ts = [], iv = [], last = 0;
  const step = () => {
    const t = f / 60, a = performance.now(); if (last) iv.push(a - last); last = a;
    g.setTransform(dpr * 1.5, 0, 0, dpr * 1.5, 0, 0); g.fillStyle = '#222'; g.fillRect(0, 0, W, H);
    S[names2[si]](t);
    ts.push(performance.now() - a);
    if (++f === 150) {
      const w = ts.slice(30).sort((x, y) => x - y);
      const v = iv.slice(30).sort((x, y) => x - y);
      out.push(`${names2[si]} med ${w[w.length >> 1].toFixed(2)} p95 ${w[Math.floor(w.length * .95)].toFixed(2)} max ${w[w.length - 1].toFixed(2)}` + (raf ? ` frame med ${v[v.length >> 1].toFixed(1)} p95 ${v[Math.floor(v.length * .95)].toFixed(1)}` : ''));
      f = 0; ts = []; iv = []; last = 0; si++;
      if (si === names2.length) { document.getElementById('o').textContent = 'RES ' + out.join(' | '); return; }
    }
    if (raf) requestAnimationFrame(step); else step();
  };
  step();
}
if (V === 'bench') bench(); else if (V === 'machine') machine(); else { draw(); for (let i = 1; i < 30; i++) setTimeout(draw, i * 70); }
</script>
